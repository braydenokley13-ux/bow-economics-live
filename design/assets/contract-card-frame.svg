<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 520" width="380" height="520" role="img" aria-label="Player contract card frame with name, position, and salary zones">
  <defs>
    <linearGradient id="cardBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b212c"/>
      <stop offset="100%" stop-color="#141924"/>
    </linearGradient>
    <linearGradient id="photoZone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232a37"/>
      <stop offset="100%" stop-color="#12161e"/>
    </linearGradient>
    <radialGradient id="stageLight" cx="50%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#4da2e8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4da2e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="salaryTag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232a37"/>
      <stop offset="100%" stop-color="#1b212c"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="8" y="8" width="364" height="504" rx="16"/>
    </clipPath>
  </defs>

  <!-- card base -->
  <rect x="8" y="8" width="364" height="504" rx="16" fill="url(#cardBase)"/>
  <rect x="8.75" y="8.75" width="362.5" height="502.5" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>

  <g clip-path="url(#cardClip)">
    <!-- photo / silhouette zone -->
    <rect x="8" y="8" width="364" height="290" fill="url(#photoZone)"/>
    <rect x="8" y="8" width="364" height="290" fill="url(#stageLight)"/>

    <!-- abstract athletic silhouette: geometric action pose, no likeness -->
    <g transform="translate(190,205)" fill="#ffffff" fill-opacity="0.10">
      <circle cx="6" cy="-92" r="26"/>
      <path d="M -70 60 C -74 -6 -34 -46 8 -46 C 54 -46 88 -8 78 54 L 108 108 L 84 122 L 48 66 L 40 150 L 66 220 L 40 226 L 8 150 L -22 224 L -48 216 L -18 142 L -30 64 L -60 118 L -84 104 Z"/>
    </g>

    <!-- diagonal sheen -->
    <polygon points="8,8 372,8 372,298 8,120" fill="url(#sheen)"/>

    <!-- diagonal cut divider into info panel -->
    <polygon points="8,298 372,262 372,298" fill="#0d1119"/>
  </g>

  <!-- team crest mount, top-left -->
  <circle cx="52" cy="52" r="30" fill="#0d1119"/>
  <circle cx="52" cy="52" r="30" fill="none" stroke="#f4b942" stroke-width="2"/>
  <path d="M 52 32 L 68 40 L 68 58 C 68 70 60 78 52 82 C 44 78 36 70 36 58 L 36 40 Z" fill="#3a4354"/>
  <text x="52" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="10" fill="#f6f4ec" letter-spacing="1">CREST</text>

  <!-- position tag chip, top-right -->
  <rect x="272" y="26" width="82" height="34" rx="17" fill="#0d1119" fill-opacity="0.85"/>
  <rect x="272.5" y="26.5" width="81" height="33" rx="16.5" fill="none" stroke="#4da2e8" stroke-width="1.5"/>
  <text x="313" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" letter-spacing="1.5" fill="#4da2e8">POS</text>

  <!-- name plate -->
  <text x="30" y="342" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="27" fill="#f6f4ec">PLAYER NAME</text>
  <text x="30" y="368" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="14" letter-spacing="1.5" fill="#737b8c">FICTIONAL TEAM · POSITION</text>

  <!-- divider -->
  <line x1="30" y1="386" x2="350" y2="386" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- salary tag: big-number zone -->
  <rect x="30" y="402" width="320" height="76" rx="12" fill="url(#salaryTag)"/>
  <rect x="30.5" y="402.5" width="319" height="75" rx="11.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
  <text x="48" y="434" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="12" letter-spacing="2" fill="#737b8c">SALARY</text>
  <text x="48" y="466" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="34" fill="#f4b942">$00M</text>
  <text x="332" y="466" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="12" letter-spacing="1.5" fill="#737b8c">/ $100M CAP</text>

  <!-- cap-fit indicator strip, swap fill per cap-safe / cap-tight / over-the-line -->
  <rect x="8" y="498" width="364" height="14" rx="7" fill="#12946a"/>
</svg>
