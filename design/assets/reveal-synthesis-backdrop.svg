<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Reveal and synthesis moment backdrop: converging spotlight over the arena floor">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0d12"/>
      <stop offset="100%" stop-color="#0d1119"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="46%" r="46%">
      <stop offset="0%" stop-color="#f4b942" stop-opacity="0.26"/>
      <stop offset="35%" stop-color="#f4b942" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f4b942" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreCool" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#4da2e8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4da2e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rayGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4b942" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f4b942" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="rayBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4da2e8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4da2e8" stop-opacity="0.07"/>
    </linearGradient>
    <radialGradient id="floorGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#f4b942" stop-opacity="0.08"/>
      <stop offset="55%" stop-color="#f4b942" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#f4b942" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="revealVig" cx="50%" cy="46%" r="72%">
      <stop offset="45%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#rbg)"/>

  <!-- converging rays, alternating gold / blue, rotated around the reveal point -->
  <g transform="translate(960,494)">
    <g id="rays">
      <polygon points="0,0 7,-760 -7,-760" fill="url(#rayGold)"/>
    </g>
    <use href="#rays" transform="rotate(24)"/>
    <use href="#rays" transform="rotate(48)"/>
    <use href="#rays" transform="rotate(72)"/>
    <use href="#rays" transform="rotate(96)"/>
    <use href="#rays" transform="rotate(120)"/>
    <use href="#rays" transform="rotate(144)"/>
    <use href="#rays" transform="rotate(168)"/>
    <use href="#rays" transform="rotate(192)"/>
    <use href="#rays" transform="rotate(216)"/>
    <use href="#rays" transform="rotate(240)"/>
    <use href="#rays" transform="rotate(264)"/>
    <use href="#rays" transform="rotate(288)"/>
    <use href="#rays" transform="rotate(312)"/>
    <use href="#rays" transform="rotate(336)"/>
    <g id="raysBlue">
      <polygon points="0,0 4,-760 -4,-760" fill="url(#rayBlue)"/>
    </g>
    <use href="#raysBlue" transform="rotate(12)"/>
    <use href="#raysBlue" transform="rotate(60)"/>
    <use href="#raysBlue" transform="rotate(108)"/>
    <use href="#raysBlue" transform="rotate(156)"/>
    <use href="#raysBlue" transform="rotate(204)"/>
    <use href="#raysBlue" transform="rotate(252)"/>
    <use href="#raysBlue" transform="rotate(300)"/>
    <use href="#raysBlue" transform="rotate(348)"/>
  </g>

  <!-- reveal-point glow core -->
  <rect width="1920" height="1080" fill="url(#coreCool)"/>
  <rect width="1920" height="1080" fill="url(#core)"/>

  <!-- stage floor reflection -->
  <ellipse cx="960" cy="1080" rx="1000" ry="260" fill="url(#floorGlow)"/>

  <!-- fine light particles / atmosphere dust, not celebratory iconography -->
  <g fill="#f6f4ec">
    <circle cx="320" cy="220" r="2" fill-opacity="0.35"/>
    <circle cx="510" cy="140" r="1.5" fill-opacity="0.25"/>
    <circle cx="700" cy="300" r="2.5" fill-opacity="0.3"/>
    <circle cx="1240" cy="180" r="2" fill-opacity="0.3"/>
    <circle cx="1460" cy="260" r="1.5" fill-opacity="0.22"/>
    <circle cx="1620" cy="150" r="2" fill-opacity="0.28"/>
    <circle cx="180" cy="420" r="1.5" fill-opacity="0.2"/>
    <circle cx="1740" cy="420" r="2" fill-opacity="0.25"/>
    <circle cx="960" cy="120" r="2" fill-opacity="0.3"/>
    <circle cx="420" cy="560" r="1.5" fill-opacity="0.18"/>
    <circle cx="1500" cy="600" r="1.5" fill-opacity="0.18"/>
    <circle cx="860" cy="240" r="1.5" fill-opacity="0.22"/>
    <circle cx="1090" cy="330" r="2" fill-opacity="0.24"/>
  </g>

  <!-- focus vignette: keeps the reveal point brightest, edges recede -->
  <rect width="1920" height="1080" fill="url(#revealVig)"/>
</svg>
