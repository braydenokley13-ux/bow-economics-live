<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BOW Economics — Play</title>
<link rel="stylesheet" href="/shared/theme.css" />
<link rel="stylesheet" href="/shared/m2.css" />
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); background: var(--surface-panel);
    display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-family: var(--font-display); letter-spacing: .08em; font-size: 15px; margin: 0; color: var(--ink-secondary); text-transform: uppercase; }
  main { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: 16px 14px 40px; display: flex; flex-direction: column; gap: 14px; }
  label { font-size: 13px; color: var(--ink-muted); display: block; margin: 10px 0 4px; }
  input { font-size: 16px; padding: 10px 12px; border: 1px solid rgba(255,255,255,0.14); border-radius: 8px; width: 100%;
    background: var(--surface-inset); color: var(--ink-primary); }
  input::placeholder { color: var(--ink-muted); }
  button.full { width: 100%; margin-top: 12px; }
  .link { background: none; border: none; color: var(--accent-blue); text-decoration: underline; width: auto; padding: 0; margin-top: 10px; cursor: pointer; font-size: 13px; }
  .center { text-align: center; }
  .pinbox { font-family: var(--font-number); font-size: 32px; letter-spacing: .2em; font-weight: 800; text-align: center; color: var(--accent-gold); }
  #err { color: var(--over-the-line); font-size: 13px; min-height: 16px; }
  #syncStatus { font-size: 11px; color: var(--ink-muted); }
  .banner { padding: 14px; border-radius: 10px; background: var(--surface-panel); font-size: 14px; color: var(--ink-secondary); text-align: center; }
  section.card { padding: 20px; }
  /* FINAL CALL. Sticky, because the pair is usually looking at a dial halfway
     down a scrolled page when the window starts closing, and a warning they
     have to scroll up to find is not a warning. */
  #finalCall { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; border-radius: 10px; margin-bottom: 2px;
    background: var(--surface-elevated, #241c0c); border: 1px solid var(--accent-gold);
    box-shadow: 0 6px 18px rgba(0,0,0,0.45); }
  #finalCall.unlocked { border-color: var(--over-the-line); background: #2a1410; }
  #fcClock { font-family: var(--font-number); font-weight: 800; font-size: 30px; line-height: 1;
    color: var(--accent-gold); font-variant-numeric: tabular-nums; min-width: 74px; }
  #finalCall.unlocked #fcClock { color: var(--over-the-line); }
  #fcText { font-size: 13px; color: var(--ink-secondary); }
  #fcText b { color: var(--ink-primary); display: block; font-family: var(--font-display); letter-spacing: .06em;
    text-transform: uppercase; font-size: 12px; margin-bottom: 2px; }
  @media (prefers-reduced-motion: no-preference) {
    #finalCall.unlocked { animation: fcPulse 1.4s ease-in-out infinite; }
    @keyframes fcPulse { 0%,100% { box-shadow: 0 6px 18px rgba(0,0,0,0.45); } 50% { box-shadow: 0 6px 18px rgba(0,0,0,0.45), 0 0 0 3px rgba(224,87,79,0.28); } }
  }
</style>
</head>
<body>
<header>
  <h1>BOW Economics</h1>
  <span id="syncStatus"></span>
</header>
<main>
  <section id="joinCard" class="card">
    <h2 class="eyebrow" style="margin-top:0; font-size:13px;">Join your class</h2>
    <label for="joinCode">Class code</label>
    <input id="joinCode" placeholder="BOW347" autocomplete="off" autocapitalize="characters" />
    <label for="joinName">Your first name</label>
    <input id="joinName" placeholder="Alex" autocomplete="off" />
    <label for="joinName2">Working with a partner? Add their name too (optional)</label>
    <input id="joinName2" placeholder="Sam" autocomplete="off" />
    <button id="btnJoin" class="btn btn-primary full">Join</button>
    <button id="btnShowRejoin" class="link">Already joined on another device? Use your rejoin PIN</button>
  </section>

  <section id="rejoinCard" class="card" hidden>
    <h2 class="eyebrow" style="margin-top:0; font-size:13px;">Rejoin your seat</h2>
    <label for="rejoinCode">Class code</label>
    <input id="rejoinCode" placeholder="BOW347" autocomplete="off" autocapitalize="characters" />
    <label for="rejoinName">Your name (exactly as you joined)</label>
    <input id="rejoinName" autocomplete="off" />
    <label for="rejoinPin">4-digit rejoin PIN</label>
    <input id="rejoinPin" inputmode="numeric" maxlength="4" autocomplete="off" />
    <button id="btnRejoin" class="btn btn-primary full">Rejoin</button>
    <button id="btnShowJoin" class="link">Back to join</button>
  </section>

  <div id="err"></div>

  <!-- gate-l1-projector repair 6 / gate-l1-visual H3: this block was permanent
       and never re-hidden, so a session-recovery affordance sat in the hero slot
       of the decision surface for the whole lesson and pushed LOCK IT IN below
       the fold on every Chromebook. It now shows once, on join, and collapses to
       a one-line strip the pair can reopen. -->
  <section id="pinCard" class="card" hidden>
    <div class="pinrow">
      <div>
        <p class="eyebrow" style="font-size:12px; margin:0 0 6px;">Your rejoin PIN — write it down in case you switch devices:</p>
        <div class="pinbox" id="pinDisplay"></div>
      </div>
      <button type="button" class="btn" id="btnHidePin">Got it</button>
    </div>
  </section>
  <button type="button" class="pin-reopen" id="btnShowPin" hidden>Rejoin PIN</button>

  <section id="gameCard" hidden>
    <!-- W3: the closing window, said to the pair in their own terms. Not a
         generic "time's up" — when this desk has committed nothing it names the
         lesson's own fallback, which is the only version of this warning that
         changes what a student does next. -->
    <div id="finalCall" hidden>
      <span id="fcClock"></span>
      <span id="fcText"></span>
    </div>
    <div class="eyebrow" id="gameHeader" style="font-size:12px; margin-bottom:10px;"></div>
    <div id="gameBody"></div>
  </section>
</main>
<script type="module" src="/play/main.js"></script>
</body>
</html>
