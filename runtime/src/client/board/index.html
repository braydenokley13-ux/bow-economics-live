<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BOW Economics — Board</title>
<link rel="stylesheet" href="/shared/theme.css" />
<style>
  html, body { height: 100%; overflow: hidden; }
  #backdrop {
    position: fixed; inset: 0; background-size: cover; background-position: center;
    background-image: url("/assets/board-arena-backdrop.svg");
    transition: background-image 700ms var(--ease-decel), opacity 700ms var(--ease-decel);
  }
  #backdrop.peak { background-image: url("/assets/reveal-synthesis-backdrop.svg"); }
  /* gate-l1-projector repair 2 (BLOCKING) / gate-l1-visual H1: this was
     `height:100vh` + `justify-content:center` inside `body{overflow:hidden}`, so
     any frame taller than the viewport silently lost BOTH its top and its bottom
     with no scrollbar and no signal — a text assertion passed while the room
     could not see the text. Worst case was SYNTHESIS, where the heading and the
     first row of card titles were off the top at 1366x768 AND 1920x1080.
     `safe center` centres only while the content fits and falls back to
     start-alignment the moment it does not, so nothing is ever unreachable, and
     `overflow-y:auto` gives the teacher a way to reach the rest. */
  #stage { position: relative; z-index: 1; min-height: 100vh; max-height: 100vh; width: 100vw; display: flex; flex-direction: column;
    align-items: safe center; justify-content: safe center; text-align: center; padding: 2.2vh 3.2vw; overflow-y: auto; overscroll-behavior: contain; }
  .label { font-family: var(--font-display); font-size: 2.4vw; color: var(--ink-secondary); margin-bottom: 1vh;
    text-transform: uppercase; letter-spacing: .1em; }
  .sub { font-size: 2vw; color: var(--ink-muted); margin-top: 2vh; }
  .code { font-family: var(--font-number); font-size: 12vw; font-weight: 800; letter-spacing: .05em; color: var(--accent-gold); }
  .banner { font-size: 2.4vw; color: var(--ink-primary); }
  #hud { position: fixed; top: 14px; right: 18px; font-size: 12px; color: var(--ink-muted); z-index: 2; }

  /* Bar chart sizing note: `.bars` deliberately keeps the default `align-items: stretch` (do not
     set flex-end here) so every `.barwrap` gets a *definite* height equal to the container's
     46vh — without that, `.stack`'s percentage height below has no definite containing block to
     resolve against and silently collapses to zero in every browser. `.barwrap` then uses
     `justify-content: flex-end` to bottom-pack its own (auto-height) label children around the
     one child that actually carries a data-driven height, `.stack`. */
  .bars { display: flex; gap: 1.6vw; height: 46vh; margin-top: 3vh; overflow-x: auto; max-width: 92vw; padding-bottom: 6px; }
  .barwrap { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: .8vh; width: 6.4vw; min-width: 62px; flex-shrink: 0; }
  .barcount { font-family: var(--font-number); font-size: 1.6vw; font-weight: 800; color: var(--accent-gold); }
  .stack { width: 100%; display: flex; flex-direction: column-reverse; border-radius: 8px 8px 0 0; overflow: hidden; align-items: stretch; }
  .seg { width: 100%; flex-shrink: 0; transition: height 400ms var(--ease-decel); }
  .barlabel { font-size: 1vw; color: var(--ink-muted); text-transform: capitalize; }

  .kpirow { display: flex; gap: 2vw; margin-top: 3vh; }
  .kpi { background: rgba(19,24,34,0.75); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1.4vh 1.6vw; }
  .kpi .num { font-family: var(--font-number); font-weight: 800; font-size: 3vw; color: var(--accent-gold); }
  .kpi .lbl { font-size: 1vw; color: var(--ink-muted); text-transform: uppercase; letter-spacing: .05em; }

  /* The 1000px cap froze the chart's rendered type at ~1.3% of screen height on a
     1080p projector no matter how big the screen was. It scales with the room now. */
  .scatter-wrap { width: 80vw; max-width: none; margin-top: 1.4vh; }
  .scatter-svg { width: 100%; height: auto; display: block; }
  .scatter-legend { display: flex; justify-content: center; align-items: center; margin-top: 1.4vh; font-size: 1.5vw; color: var(--ink-secondary); flex-wrap: wrap; gap: .4vw; }
  .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .legend-dot.h1 { background: var(--series-1); }
  .legend-dot.h2 { background: var(--series-2); }

  .cardgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1vw; max-width: 92vw; margin-top: 1.6vh; }
  .synthcard { background: rgba(19,24,34,0.85); border: 1px solid rgba(244,185,66,0.35); border-radius: 14px; padding: 1vw 1.1vw; text-align: left; }
  .synthcard h3 { margin: 0 0 .6vh; font-family: var(--font-display); letter-spacing: .06em; font-size: 1.5vw; color: var(--accent-gold); text-transform: uppercase; }
  .synthcard p { margin: 0; font-size: .95vw; line-height: 1.4; color: var(--ink-secondary); }
  .synthesis-note { max-width: 74vw; font-size: 1.1vw; color: var(--ink-muted); margin-top: 1.4vh; line-height: 1.4; }
  .exit-prompt { font-size: 1.4vw; color: var(--ink-primary); margin-top: 1.2vh; font-weight: 600; }

  /* ---- M1 L3 Free Agency: the live signing-window ticker ---- */
  .fa-ticker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1vw; max-width: 92vw; margin-top: 2vh; }
  .fa-ticker-card { background: rgba(19,24,34,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1vw 1.1vw; text-align: left; }
  .fa-ticker-card.signed { border-color: rgba(18,148,106,0.5); background: rgba(18,148,106,0.08); }
  .fa-ticker-name { font-weight: 700; font-size: 1.05vw; color: var(--ink-primary); }
  .fa-ticker-meta { font-size: 0.75vw; color: var(--ink-muted); text-transform: uppercase; letter-spacing: .04em; }
  .fa-ticker-ask-row { display: flex; align-items: baseline; justify-content: space-between; margin-top: .6vh; }
  .fa-ticker-ask { font-family: var(--font-number); font-weight: 800; font-size: 1.6vw; color: var(--accent-gold); }
  .fa-ticker-trend { font-size: 1vw; font-weight: 800; }
  .fa-ticker-trend.up { color: var(--over-the-line); }
  .fa-ticker-trend.down { color: var(--cap-safe); }
  .fa-ticker-trend.flat { color: var(--ink-muted); }
  .fa-ticker-interest { font-size: 0.75vw; color: var(--ink-secondary); margin-top: .4vh; }
  .fa-ticker-signed { font-size: 0.75vw; font-weight: 800; color: var(--cap-safe); margin-top: .4vh; text-transform: uppercase; }
  .fa-caproom-row { display: flex; flex-wrap: wrap; gap: 1vw; max-width: 90vw; margin-top: 2vh; justify-content: center; }
  .fa-caproom-tile { background: rgba(19,24,34,0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: .8vh 1.2vw; font-size: .9vw; color: var(--ink-secondary); }
  .fa-caproom-tile .num { font-family: var(--font-number); font-weight: 800; color: var(--accent-gold); }
  .fa-standings-row { display: flex; align-items: center; gap: 1vw; max-width: 60vw; margin: .5vh auto; padding: .6vh 1.2vw; background: rgba(19,24,34,0.7); border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); }
  .fa-standings-row.playoff-line { border-color: rgba(244,185,66,0.5); }
  .fa-standings-rank { font-family: var(--font-number); font-weight: 800; color: var(--accent-gold); width: 2vw; }
  .fa-standings-name { flex: 1; text-align: left; font-size: 1vw; }
  .fa-standings-form { font-family: var(--font-number); font-weight: 700; font-size: 1vw; color: var(--ink-primary); }
  .fa-bracket-row { display: flex; justify-content: center; gap: 2vw; max-width: 90vw; margin-top: 1.5vh; flex-wrap: wrap; }
  .fa-bracket-card { background: rgba(19,24,34,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1vw 1.4vw; min-width: 16vw; }
  .fa-bracket-title { font-size: .8vw; color: var(--ink-muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: .6vh; }
  .fa-bracket-side { display: flex; justify-content: space-between; font-size: 1vw; padding: .3vh 0; color: var(--ink-secondary); }
  .fa-bracket-side.winner { color: var(--accent-gold); font-weight: 800; }

  /* ---- M2 L1 Full House ---- */
  .fh-board-card { background: rgba(19,24,34,0.9); border: 1px solid rgba(244,185,66,0.4); border-radius: 16px;
    padding: 1.4vh 2vw; margin-top: 1.6vh; max-width: 72vw; text-align: left; }
  .fh-board-card-top { display: flex; justify-content: space-between; align-items: baseline; }
  .fh-board-night { font-family: var(--font-display); font-size: 2vw; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-gold); }
  .fh-board-tv { font-size: .9vw; letter-spacing: .12em; color: var(--ink-muted); border: 1px solid rgba(255,255,255,.16); border-radius: 20px; padding: .3vh .8vw; }
  .fh-board-matchup { font-size: 1.7vw; color: var(--ink-primary); margin-top: .6vh; }
  .fh-board-draw { font-size: 1vw; letter-spacing: .08em; color: var(--ink-muted); margin-top: .8vh; }
  .fh-board-draw .num { font-family: var(--font-number); font-size: 1.8vw; font-weight: 800; color: var(--accent-gold); }
  .fh-board-notes { margin-top: .8vh; }
  .fh-board-notes div { font-size: 1.1vw; color: var(--ink-secondary); line-height: 1.45; }

  /* W3 projector repair 1: while the room's own evidence is on the projector,
     tonight's card and the lock count are one strip, not two stacked panels
     (175px + 92px) above a panel that needs the whole frame. Every pair still
     has the full card on its own device. */
  .fh-play-strip { display: flex; align-items: baseline; justify-content: center; flex-wrap: wrap;
    gap: 1.6vw; max-width: 92vw; margin-top: .4vh; padding: .6vh 1.6vw;
    background: rgba(19,24,34,0.82); border: 1px solid rgba(244,185,66,0.35); border-radius: 12px; }
  .fh-play-strip-night { font-family: var(--font-display); font-size: 2vw; letter-spacing: .08em;
    text-transform: uppercase; color: var(--accent-gold); }
  .fh-play-strip-card { font-size: 1.5vw; color: var(--ink-primary); }
  .fh-play-strip-locked { font-size: 1.5vw; color: var(--ink-secondary); }
  .fh-play-strip-locked .num { font-family: var(--font-number); font-weight: 800; color: var(--ink-primary); }

  .fh-market-row { display: flex; gap: 2vw; margin-top: 2.4vh; flex-wrap: wrap; justify-content: center; }
  .fh-market-tile { background: rgba(19,24,34,0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
    padding: 1.4vh 1.6vw; min-width: 22vw; text-align: left; }
  .fh-market-club { font-family: var(--font-display); font-size: 1.8vw; letter-spacing: .06em; color: var(--ink-primary); text-transform: uppercase; }
  .fh-market-building { font-size: 1vw; color: var(--accent-gold); letter-spacing: .06em; }
  .fh-market-line { font-size: 1.1vw; color: var(--ink-secondary); margin-top: .6vh; }
  .fh-market-cap { font-size: .95vw; color: var(--ink-muted); margin-top: .6vh; }
  /* BC-3: the season stamp sits with the figure, on the projector, not only in a source note. */
  .fh-market-stamp { font-size: .75vw; color: var(--ink-muted); opacity: .8; margin-top: .2vh; }
  /* The night key for the class chart (gate-l1-play P1): colour = market, shape = night. */
  .legend-sep { display: inline-block; width: 2vw; }
  .legend-shape { display: inline-flex; align-items: center; gap: .3vw; margin-left: 1.1vw; font-size: 1.5vw; }
  /* Two Peaks money view (gate-l1-play): show the peaks, don't assert them. */
  .fh-money-svg { width: 100%; max-width: 32vw; height: auto; display: block; margin-top: .6vh; }
  .fh-money-key { display: flex; align-items: center; gap: .5vw; font-size: 1.5vw; color: var(--ink-secondary); }
  .fh-money-swatch { display: inline-block; width: 22px; height: 0; border-top: 3px solid var(--accent-gold); margin-left: 1vw; }
  .fh-money-swatch.dash { border-top: 2px dashed var(--ink-secondary); margin-left: 0; }
  .fh-slate-board { display: flex; gap: .8vw; margin-top: 1.6vh; flex-wrap: wrap; justify-content: center; max-width: 88vw; }
  .fh-slate-card { background: rgba(19,24,34,0.75); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
    padding: .8vh 1vw; min-width: 13vw; text-align: left; }
  .fh-slate-night { font-family: var(--font-display); font-size: 1.1vw; letter-spacing: .06em; color: var(--accent-gold); }
  .fh-slate-day { font-size: .95vw; color: var(--ink-primary); }
  .fh-slate-visitor { font-size: .85vw; color: var(--ink-secondary); line-height: 1.3; }
  .fh-slate-draw { font-size: .75vw; letter-spacing: .08em; color: var(--ink-muted); margin-top: .3vh; }
  .fh-slate-draw .num { font-family: var(--font-number); font-weight: 800; color: var(--ink-primary); font-size: 1vw; }
  .fh-slate-tv { font-size: .7vw; letter-spacing: .1em; color: var(--ink-muted); }
  .fh-desk-row { display: flex; flex-wrap: wrap; gap: 1vw; margin-top: 2vh; justify-content: center; max-width: 86vw; }
  .fh-desk-chip { display: flex; align-items: center; gap: .5vw; background: rgba(19,24,34,0.75);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: .5vh 1vw; font-size: 1vw; color: var(--ink-secondary); }

  /* Two markets side by side: the money view added height to each, and the
     projector is a fixed, non-scrolling surface. */
  .fh-peaks-board { background: rgba(19,24,34,0.9); border: 1px solid rgba(244,185,66,0.5); border-radius: 16px;
    padding: 1.6vh 2vw; margin-top: 2vh; max-width: 74vw;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(28vw, 1fr)); column-gap: 2vw; }
  .fh-peaks-title { font-family: var(--font-display); font-size: 1.6vw; letter-spacing: .12em; color: var(--accent-gold); grid-column: 1 / -1; }
  .fh-peaks-punch { grid-column: 1 / -1; }
  .fh-peaks-market { margin-top: 1vh; text-align: left; }
  .fh-peaks-club { font-size: 1.5vw; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-secondary); }
  .fh-peaks-line { display: flex; justify-content: space-between; font-size: 1.3vw; color: var(--ink-secondary); padding: .2vh 0; }
  .fh-peaks-line .num { font-family: var(--font-number); font-weight: 800; color: var(--ink-primary); }
  .fh-peaks-line.hot .num { color: var(--accent-gold); font-size: 1.9vw; }
  .fh-peaks-gap { font-size: 1.5vw; color: var(--ink-secondary); }
  .fh-peaks-punch { margin-top: 1.2vh; font-size: 1.8vw; color: var(--ink-primary); font-weight: 700; }

  .fh-books-row { display: flex; gap: 2vw; margin-top: 1.2vh; justify-content: center; flex-wrap: wrap; }
  .fh-books-tile { background: rgba(19,24,34,0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
    padding: 1.2vh 1.6vw; min-width: 20vw; text-align: left; }
  .fh-books-club { font-family: var(--font-display); font-size: 1.9vw; letter-spacing: .06em; color: var(--accent-gold); text-transform: uppercase; }
  .fh-books-stat { display: flex; justify-content: space-between; gap: 1.2vw; font-size: 1.5vw; color: var(--ink-secondary); padding: .2vh 0; }
  .fh-books-stat .num { font-family: var(--font-number); font-weight: 800; color: var(--ink-primary); }

  .fh-questions-board { display: flex; flex-direction: column; gap: 1.2vh; margin-top: 2vh; max-width: 72vw; }
  .fh-questions-board div { font-size: 1.6vw; color: var(--ink-primary); line-height: 1.4; }

  .fh-repeat-board { display: flex; flex-direction: column; gap: 1vh; margin-top: 2vh; width: 78vw; }
  .fh-repeat-row { background: rgba(19,24,34,0.75); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: .8vh 1.2vw; text-align: left; }
  .fh-repeat-handle { font-size: 1.5vw; color: var(--ink-primary); }
  .fh-repeat-same { font-size: 1.5vw; color: var(--accent-gold); letter-spacing: .04em; }
  .fh-repeat-same.diff { color: var(--ink-muted); }
  .fh-repeat-bars { display: flex; flex-direction: column; gap: .3vh; margin: .5vh 0; }
  .fh-repeat-bar { height: 3.4vh; border-radius: 4px; display: flex; align-items: center; justify-content: flex-end;
    padding-right: .5vw; font-family: var(--font-number); font-size: 1.5vw; font-weight: 800; color: #06121d; min-width: 6vw;
    transition: width 600ms var(--ease-decel); }
  /* P11-b: the paged COUNTERFACTUAL group. Type stays at the evidence tier the
     projector review asked for (>=2.6% of screen height) — only the vertical
     padding and the bar height give ground, because it is the ROW COUNT that
     scales with the class, not the row. */
  .fh-cf-grid .fh-repeat-row { padding: .55vh 1.2vw; }
  .fh-cf-grid .fh-repeat-bar { height: 2.9vh; }
  .fh-cf-grid .fh-repeat-bars { gap: .25vh; margin: .35vh 0; }
  .fh-cf-grid .fh-repeat-board { gap: .7vh; }
  /* The scatter is argue-fuel beside the rows, not the frame's centrepiece — at
     full width it took 321px of a 768px projector on its own and pushed the
     class summary under the fold. Capped by HEIGHT so it keeps its aspect. */
     W3: capping it by HEIGHT drove its own axis type down to 1.30% of screen
     height — the smallest evidence in the lesson. It is sized by the column now
     and its internal type is computed from that width (`fhAxisType`). */
  .fh-cf-grid .scatter-svg { width: 100%; height: auto; max-width: 100%; margin: 0 auto; }
  .fh-cf-grid .scatter-legend { margin-top: .5vh; font-size: 1.5vw; }
  #stage.fh-tight .fh-cf-grid { margin-top: .6vh; }
  #stage.fh-tight .exit-prompt { font-size: 1.25vw; }
  .fh-cf-pager { font-family: var(--font-display); font-size: 1.25vw; letter-spacing: .1em; text-transform: uppercase;
    color: var(--accent-gold); text-align: left; width: 100%; margin-bottom: .5vh; }
  /* `gate-l1-play` W3-1: paging made this sentence the ONLY carrier of the
     room-level pattern (no student can count "8 up, 2 down" off three rows at a
     time), and it rendered at 2.05% of screen height under a LARGER caveat.
     Above the 2.6% back-row floor now, and no longer outranked by the caveat. */
  .fh-cf-summary { margin-top: .9vh; text-align: left; max-width: none; font-size: 1.6vw;
    font-weight: 600; line-height: 1.3; color: var(--ink-primary); }
  .fh-cf-pager-hint { margin-top: .8vh; font-size: .95vw; color: var(--ink-muted); text-align: left; }
  .fh-repeat-bar.n1 { background: var(--series-1); }
  .fh-repeat-bar.n5 { background: var(--accent-violet); }
  .fh-repeat-renew { font-size: 1.5vw; color: var(--ink-secondary); }

  /* The projector never scrolls: once a staged panel lands, the curve shrinks. */
  .scatter-wrap.compact { width: 52vw; margin-top: 1vh; }
  .fh-compact .fh-peaks-board { padding: 1vh 1.6vw; margin-top: 1vh; }
  .fh-compact .fh-peaks-punch { font-size: 1.5vw; margin-top: .6vh; }
  .fh-compact .fh-books-row { margin-top: 1vh; }

  /* gate-l1-projector repair 2, TIGHTEN limb: the stacked REVEAL beats give up
     leading and chart width, never type size — the review's back-row evidence
     floor (>=2.6% of screen height) is what the class has to read. */
  #stage.fh-tight { padding-top: 1.4vh; padding-bottom: 1.4vh; }
  #stage.fh-tight .label { margin-bottom: .4vh; }
  #stage.fh-tight .fh-nights-up { margin-top: .3vh; }
  #stage.fh-tight .fh-reveal-rule { margin-top: .6vh; padding: .9vh 1.6vw; }
  #stage.fh-tight .scatter-wrap.compact { width: 44vw; margin-top: .5vh; }
  #stage.fh-tight .scatter-legend { margin-top: .5vh; }
  #stage.fh-tight .synthesis-note { margin-top: .6vh; }
  #stage.fh-tight .exit-prompt { margin-top: .5vh; }
  #stage.fh-tight .fh-books-row { margin-top: .6vh; }
  #stage.fh-tight .fh-books-tile { padding: .8vh 1.4vw; }
  #stage.fh-tight .fh-peaks-board { margin-top: .8vh; padding: 1vh 1.6vw; }
  #stage.fh-tight .fh-peaks-market { margin-top: .4vh; }
  #stage.fh-tight .fh-peaks-punch { margin-top: .6vh; }
  #stage.fh-tight .fh-play-strip { margin-top: 0; }
  #stage.fh-tight .scatter-wrap { margin-top: .8vh; }

  .fh-nights-up { font-size: 1.5vw; letter-spacing: .1em; color: var(--ink-secondary); margin-top: .6vh; }
  /* `play-l1-repairs-below-fold`: the renewals rule owns its own reveal stage and
     sits above the chart, so it is on the projector without a scroll. */
  .fh-reveal-rule { max-width: 84vw; font-size: 1.45vw; line-height: 1.35; color: var(--ink-primary);
    background: rgba(19,24,34,0.9); border: 1px solid rgba(244,185,66,0.45); border-radius: 14px;
    padding: 1.2vh 1.8vw; margin-top: 1vh; text-align: left; }
  /* COUNTERFACTUAL, same dissent: the scatter the prompt in the largest type on
     this board tells the room to read measured a TOP of 720/839/1007 in viewports
     of 768/900/1080 — entirely below the fold — because it was stacked under the
     per-desk repeat rows. Rows and chart now share the width instead of the height. */
  .fh-cf-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.6vw;
    width: 92vw; align-items: start; margin-top: 1vh; }
  .fh-cf-grid .fh-repeat-board { width: 100%; margin-top: 0; }
  .fh-cf-grid .scatter-wrap { width: 100%; margin-top: 0; }
  .fh-cf-col { display: flex; flex-direction: column; align-items: center; min-width: 0; }
