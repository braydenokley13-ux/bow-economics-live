<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BOW Economics — Board</title>
<style>
  :root { color-scheme: dark; --ink:#f4f7fb; --muted:#8ea0b8; --bg:#0b1220; --card:#131d30; --accent:#4c8dff; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  #stage { height:100vh; width:100vw; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:4vw; }
  .code { font-size:12vw; font-weight:800; letter-spacing:.05em; }
  .label { font-size:2.2vw; color:var(--muted); margin-bottom:1vh; text-transform:uppercase; letter-spacing:.08em; }
  .sub { font-size:2.4vw; color:var(--muted); margin-top:2vh; }
  .bars { display:flex; gap:3vw; align-items:flex-end; height:40vh; margin-top:4vh; }
  .barwrap { display:flex; flex-direction:column; align-items:center; gap:1vh; width:12vw; }
  .bar { width:100%; border-radius:10px 10px 0 0; transition: height .4s ease; }
  .bar.red{background:#e5484d;} .bar.blue{background:#3b82f6;} .bar.green{background:#22a06b;} .bar.yellow{background:#f2b90c;}
  .barcount { font-size:2.6vw; font-weight:700; }
  .barlabel { font-size:1.6vw; color:var(--muted); text-transform:capitalize; }
  .synthesis-note { max-width:60vw; font-size:2vw; color:var(--muted); margin-top:3vh; line-height:1.5; }
  .banner { font-size:3vw; }
  #hud { position:fixed; top:14px; right:18px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<div id="stage"><div class="label">Connecting…</div></div>
<div id="hud"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
